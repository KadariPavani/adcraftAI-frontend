server {
    listen 8030;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA hosted under adcraftaifestage path
    location /adcraftaifestage/ {
        try_files $uri $uri/ /index.html;
    }

    # Redirect without trailing slash
    location = /adcraftaifestage {
        return 301 /adcraftaifestage/;
    }

    # Global fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
